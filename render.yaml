# Render blueprint (free tier, no card) for the /api server the Android shell
# calls through GEV_API_BASE.
#
# The free instance is 512 MB / 0.1 CPU and sleeps 15 min after the last
# request (~1 min to wake), which is why the image serves the *built* client
# with `vite preview` instead of running the dev server: the dev server's
# esbuild pre-bundling peaks above that limit.
#
# Apply: Render dashboard -> New -> Blueprint -> pick this repository.
# Then set each `sync: false` value in the service's Environment tab. They are
# plain environment variables there, never committed.
services:
  - type: web
    name: gev-data
    runtime: docker
    dockerfilePath: ./Dockerfile.preview
    plan: free
    region: frankfurt
    healthCheckPath: /
    autoDeploy: true
    # Every `sync: false` key below is pushed from a repository secret of the
    # same name by .github/workflows/render-deploy.yml, which reads the deployed
    # value first and writes only on a difference. A key with no such secret
    # keeps whatever the dashboard has, and the run says so once. Rotating a
    # value therefore means updating the secret, never the dashboard.
    # `value:` keys are not secrets and stay here.
    envVars:
      - key: GEV_ALLOWED_HOSTS
        sync: false
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
      # Active fires (/api/firms). Unset, the route answers {"error":"no_key"}
      # and the phone's fire layer stays empty. Server-side only: the app never
      # sees this key.
      - key: FIRMS_MAP_KEY
        sync: false
      # Apparent fishing effort (/api/fishing-effort). Unset, the route answers
      # {"error":"no_key"} and the Fishing Effort layer says a key is missing
      # while every other layer keeps working. Server-side only: the report
      # endpoint runs one report per token at a time, so the token never travels
      # to the phone. The deploy workflow pushes the value from the repository
      # secret of the same name, so a fresh service or a rotated key needs no
      # dashboard trip.
      - key: GFW_API_TOKEN
        sync: false
      # Detailed OpenStreetMap queries (/api/overpass). The Railway Stations
      # layer is the first caller: without an endpoint it answers
      # OVERPASS_NOT_CONFIGURED at the capability probe, and the layer reads as
      # unavailable on the phone while every other layer keeps working. A
      # comma-separated list of endpoints this deployment is allowed to read.
      #
      # Public mirrors are not used by default: list only an instance you run or
      # are entitled to. A measured stopgap is the French community instance at
      # https://overpass.openstreetmap.fr/api/interpreter — a 2° box answers in
      # ~19 s, under the proxy's 25 s cut, while the widest 6° view times out
      # upstream, so the layer is dependable at city zoom and degrades far out.
      - key: OVERPASS_UPSTREAMS
        sync: false
      # Gemini Live voice. /api/gemini/token mints the short-lived credential the
      # app attaches to the Live socket, so the voice session needs this on the
      # server even when the phone has its own key in Provider Settings.
      - key: GEMINI_API_KEY
        sync: false
      # OpenSky OAuth for flights and military traffic. `auto` uses the client
      # pair when present, then Basic, then anonymous access, so a missing pair
      # degrades to the rate-limited public feed instead of an empty layer.
      - key: OPENSKY_AUTH_MODE
        value: auto
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      # Satellites above the view centre (/api/n2yo/above) — the fourth
      # Satellite Watch source. Unset, the route answers {"error":"no_key"}
      # and that switch says a key is missing while the other four keep
      # reading. Server-side only: the browser never receives it. The deploy
      # workflow pushes the value from the repository secret of the same name,
      # so a fresh service or a rotated key needs no dashboard trip.
      - key: N2YO_API_KEY
        sync: false
      # Space-Track account (/api/spacetrack/gp and /api/spacetrack/cdm) — the
      # official element sets and the public conjunction feed for the satellite
      # layers. The routes log in server-side and cache for the windows its
      # usage policy requires (GP 1 h, CDM 8 h); a browser never holds these.
      # The deploy workflow pushes both from repository secrets of the same
      # name, so a rotation needs no dashboard trip.
      - key: SPACETRACK_USER
        sync: false
      - key: SPACETRACK_PASSWORD
        sync: false
      # Account-scoped: only the uRADMonitor units this account owns or was
      # granted. Unset, the radiation snapshot skips the network and the four
      # keyless feeds still draw.
      - key: URADMONITOR_USER_ID
        sync: false
      - key: URADMONITOR_USER_HASH
        sync: false

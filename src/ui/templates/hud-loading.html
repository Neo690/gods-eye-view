  <!-- Intelligence HUD Overlay -->
  <div id="intel-hud"></div>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <span class="loader-logo brand-logo" data-logo-gaze data-logo-src="/logo.svg" aria-hidden="true"><img src="/logo.svg" alt="" /></span>
      <h2 translate="no">GOD'S EYE <span class="title-accent">VIEW</span></h2>
      <!-- The only line the cover ever speaks: it names the step in progress and
           the degraded path taken when a step times out. A polite live region, so
           a slow start is heard and not just painted; nothing here changes how
           the line looks. -->
      <p class="loader-status" role="status" aria-live="polite" aria-atomic="true" data-i18n>Initializing photorealistic world...</p>
      <!-- The module-graph watchdog's line. If no application code ever runs,
           nothing here can be translated or written by the app; index.html's
           classic script reveals this one, and only this one. It carries the
           sentence and the way out: telling somebody to reload is not the same
           as giving them a control that reloads. -->
      <p class="loader-fallback" id="boot-watchdog" role="alert" hidden>
        <span id="boot-watchdog-text" data-i18n>Loading did not start. Reload to try again.</span>
        <a class="loader-fallback-reload" id="boot-watchdog-reload" href="" data-i18n hidden>Reload</a>
      </p>
    </div>
  </div>

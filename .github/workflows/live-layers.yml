name: Live layer canary

# The activation matrix answers every /api request from a fixture, so it proves
# the app's layer wiring but not that today's upstream responses still parse.
# This canary enables the keyless live layers and lets their real providers
# answer. It runs on a schedule, not on pull requests: an upstream outage must
# not turn every review red.
#
# A cheap `select` job resolves the dispatch filter and which keyed credentials
# exist before anything is installed, so the canary's concurrency group and the
# work each gate does are decided in seconds, and a run that cannot pass fails
# there.
#
# One live job runs both gates so checkout, install, build and Chrome are paid
# once. The keyless preview is started WITHOUT provider secrets, keeping that
# gate honest; a second preview on another port is started only when keyed
# secrets exist, so the two gates cannot contaminate each other.
#
# The gates are non-strict by default: EMPTY, UNCONFIGURED and EXTERNAL outcomes
# are reported but non-blocking, while a FAIL/MISSING layer, a teardown leak or
# an uncaught page error always exits 1. A missing or rejected credential is
# never classified as EXTERNAL. Use the manual dispatch with `strict` when the
# providers are known healthy and PASS-only is wanted for both gates.
#
# A manual dispatch can also narrow the run to named layers (`layers`). The
# filter is resolved against both manifests, so a keyed id skips the keyless
# preview and gate entirely and a keyless id skips the keyed ones; asking for a
# keyed layer whose credential is unset fails instead of testing nothing.
#
# A second, six-hourly schedule runs only the AIS layer: it is the one keyed
# layer with no keyless fallback, so its credential and socket are what rot
# silently between nightly runs. A scheduled layer whose credential is absent is
# skipped and reported instead of failing, because a missing secret must not go
# red four times a day.
#
# The final step reads both reports even when a gate failed. It labels a
# filtered run as partial, shows the layers that broke or recovered since the
# previous run, lists the keyed layers the run skipped and why, and records the
# run in the canary's tracking issue, where a failure or a recovery is
# commented. A provider that has returned EMPTY or EXTERNAL for three runs in a
# row escalates to that issue too, but never to a red run: those outcomes stay
# non-blocking by design.
on:
  schedule:
    - cron: '41 6 * * *'
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      strict:
        description: Fail on EMPTY, UNCONFIGURED and EXTERNAL outcomes too
        type: boolean
        default: false
      layers:
        description: Comma-separated layer ids to run (empty runs every live layer)
        type: string
        default: ''

permissions:
  contents: read

env:
  GEV_REQUIRE_ALLOCATION_GATE: '0'
  PUPPETEER_SKIP_DOWNLOAD: '1'
  PREVIEW_PORT: '4173'
  KEYED_PREVIEW_PORT: '4174'

jobs:
  # Resolved before the canary because `concurrency.group` cannot read a step
  # output, a filtered dispatch must not cancel an in-flight nightly run (or the
  # reverse), and a bad filter or missing credential should fail before the
  # install. This job reads only the manifests, so it stays cheap.
  select:
    name: Resolve layer selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      group: ${{ steps.selection.outputs.group }}
      filtered: ${{ steps.selection.outputs.filtered }}
      source: ${{ steps.selection.outputs.source }}
      keyless: ${{ steps.selection.outputs.keyless }}
      only: ${{ steps.selection.outputs.only }}
      skipped: ${{ steps.selection.outputs.skipped }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0

      # Secrets cannot be read in a job-level `if:`, but they can be read here.
      # The output is only the fixed list of secret names that exist; no secret
      # value is printed, and `Resolve layer selection` turns those names into
      # the layers they can actually run.
      #
      # The env mapping and the select lines are GENERATED from KEYED_LAYERS by
      # scripts/keyed-live-layers-workflow.mjs; a new keyed layer needs only a
      # KEYED_LAYERS entry, then `node scripts/keyed-live-layers-workflow.mjs
      # --write`. The unit suite fails when this block drifts from the manifest.
      - name: Detect keyed provider secrets
        id: keys
        # BEGIN GENERATED keyed-detection
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          set -euo pipefail
          present=""
          add() { present="${present:+$present,}$1"; }
          if [ -n "${FIRMS_MAP_KEY:-}" ]; then add FIRMS_MAP_KEY; fi
          if [ -n "${ACLED_EMAIL:-}" ]; then add ACLED_EMAIL; fi
          if [ -n "${ACLED_PASSWORD:-}" ]; then add ACLED_PASSWORD; fi
          if [ -n "${GFW_API_TOKEN:-}" ]; then add GFW_API_TOKEN; fi
          if [ -n "${TOMTOM_API_KEY:-}" ]; then add TOMTOM_API_KEY; fi
          if [ -n "${AISSTREAM_API_KEY:-}" ]; then add AISSTREAM_API_KEY; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
        # END GENERATED keyed-detection

      - name: Resolve layer selection
        id: selection
        env:
          LAYERS: ${{ inputs.layers }}
          SCHEDULE: ${{ github.event.schedule }}
          PRESENT: ${{ steps.keys.outputs.present }}
        run: node scripts/live-layer-selection.mjs --layers "$LAYERS" --schedule "$SCHEDULE" --present "$PRESENT" >> "$GITHUB_OUTPUT"

  live:
    name: Live layer canary
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The two layer lists are the whole condition. An unfiltered run always
    # lists keyless layers and a dispatch always lists at least one gate's, so
    # both lists empty is exactly the scheduled run whose only layer has no
    # credential — and installing, building and launching Chrome to exercise no
    # layer costs more than it proves.
    if: ${{ needs.select.outputs.keyless != '' || needs.select.outputs.only != '' }}
    permissions:
      contents: read
      # The last step records the run in the canary's tracking issue and labels
      # it while it is failing.
      issues: write
    # The group carries the resolved filter: `ais-live-vessels` and the nightly
    # `full` run never cancel each other, while two runs of the same filter still
    # cancel the older one.
    concurrency:
      group: live-layer-canary-${{ needs.select.outputs.group }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      # Same retry as the other browser jobs: the ffmpeg-static post-install
      # downloads its binary from a GitHub release asset, which 504s in bursts.
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then
              exit 0
            fi
            rm -rf node_modules
            echo "npm ci failed on attempt $attempt"
            sleep 30
          done
          exit 1

      # Catch a stale canary contract before spending time on a browser or a
      # build. These are the same static tests CI runs.
      - name: Static canary contracts
        run: node --test scripts/qa-keyless-live-layers.test.mjs scripts/live-layer-selection.test.mjs scripts/live-layer-canary.test.mjs scripts/qa-layer-activation-matrix.test.mjs

      # npm does not run dependency install scripts, so the Puppeteer
      # postinstall is skipped. Install the browser at the pinned version.
      - name: Install the browser the gate drives
        run: npx puppeteer browsers install chrome

      - name: Build production bundle
        id: build
        run: npm run build

      # Both gates need a successful build, so both check it: a preview started
      # without a bundle only tests that vite can serve a 404. `!cancelled()`
      # keeps the keyed path running after a keyless failure; a failed build
      # skips both gates, and the step summary reports what did not run.
      - name: Start keyless preview
        id: keyless-preview
        if: ${{ !cancelled() && needs.select.outputs.keyless != '' && steps.build.outcome == 'success' }}
        run: |
          npx vite preview --port "$PREVIEW_PORT" --strictPort > preview-keyless.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf "http://127.0.0.1:$PREVIEW_PORT/" > /dev/null && exit 0
            sleep 2
          done
          cat preview-keyless.log
          exit 1

      - name: Keyless live layer gate
        if: ${{ !cancelled() && steps.keyless-preview.outcome == 'success' }}
        env:
          STRICT: ${{ inputs.strict }}
          KEYLESS_ONLY: ${{ needs.select.outputs.keyless }}
        run: |
          args=(
            --url "http://127.0.0.1:$PREVIEW_PORT"
            --json qa-artifacts/keyless-live/report.json
          )
          if [ -n "$KEYLESS_ONLY" ]; then
            args+=(--only "$KEYLESS_ONLY")
          fi
          if [ "$STRICT" = "true" ]; then
            args+=(--strict)
          fi
          npm run qa:keyless-layers -- "${args[@]}"

      # A keyed failure must not hide the keyless result, so this starts even
      # when the keyless gate failed. A successful build is the only
      # prerequisite: a keyless-preview failure on its port does not stop it.
      - name: Start keyed preview
        id: keyed-preview
        if: ${{ !cancelled() && needs.select.outputs.only != '' && steps.build.outcome == 'success' }}
        # BEGIN GENERATED keyed-preview-env
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        # END GENERATED keyed-preview-env
        run: |
          npx vite preview --port "$KEYED_PREVIEW_PORT" --strictPort > preview-keyed.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf "http://127.0.0.1:$KEYED_PREVIEW_PORT/" > /dev/null && exit 0
            sleep 2
          done
          cat preview-keyed.log
          exit 1

      - name: Keyed live layer gate
        if: ${{ !cancelled() && steps.keyed-preview.outcome == 'success' }}
        env:
          ONLY: ${{ needs.select.outputs.only }}
          STRICT: ${{ inputs.strict }}
        run: |
          args=(
            --url "http://127.0.0.1:$KEYED_PREVIEW_PORT"
            --json qa-artifacts/keyed-live/report.json
            --only "$ONLY"
          )
          if [ "$STRICT" = "true" ]; then
            args+=(--strict)
          fi
          npm run qa:keyed-layers -- "${args[@]}"

      - name: Preview server logs
        if: failure()
        run: |
          for log in preview-keyless.log preview-keyed.log; do
            if [ -f "$log" ]; then
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
            fi
          done

      # Keep both reports on success as well: they are the trend line for
      # provider health, and the summary reads the same files.
      - name: Upload live layer reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-layer-reports
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

      # Reads both reports even when a gate failed: the summary is the run's
      # record, and the history step needs whatever was written. `job.status` is
      # this job's state, so a failed gate is reported as a failure and the
      # tracking issue is commented rather than refreshed. The script never
      # changes the run's conclusion; the gates already decided it.
      - name: Summarize and track live layer health
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONCLUSION: ${{ job.status }}
          FILTERED: ${{ needs.select.outputs.filtered }}
          SOURCE: ${{ needs.select.outputs.source }}
          GROUP: ${{ needs.select.outputs.group }}
          KEYLESS_ONLY: ${{ needs.select.outputs.keyless }}
          ONLY: ${{ needs.select.outputs.only }}
          SKIPPED: ${{ needs.select.outputs.skipped }}
        run: |
          node scripts/live-layer-canary.mjs report \
            --keyless qa-artifacts/keyless-live/report.json \
            --keyed qa-artifacts/keyed-live/report.json

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # actionlint checks the workflows against the real Actions schema, which
      # no Node test can do: it reads `needs.select.outputs.*` against the jobs
      # and outputs that exist, and it validates every expression. It is a
      # release binary rather than an npm dependency, so it is pinned by version
      # and checked against a recorded checksum instead of the lockfile.
      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          version=1.7.7
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

      # The ffmpeg-static post-install fetches its binary from a GitHub release
      # page, and the unauthenticated `/releases/download/` path has been
      # returning 504s in bursts since Nov 8 (community #212407). The failure is
      # intermittent, so the locked install retries over fresh `node_modules`
      # with a pause before the job is given up on.
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then
              exit 0
            fi
            rm -rf node_modules
            echo "npm ci failed on attempt $attempt"
            sleep 30
          done
          exit 1

      - name: Run setup policy checks
        run: npm run doctor -- --json

      - name: Check adopted formatting
        run: npm run format:check

      # The code is the source of every message key, so a string added without
      # its five translations only fails here: a review that never opens a
      # locale file would otherwise merge an English-only screen.
      - name: Check translation catalogs
        run: npm run i18n

      - name: Check package boundaries
        run: npm run check:boundaries

      # Windows, Android and iOS publish from one web bundle, but each shell
      # names its own identifier, artifact and version. This reads those
      # declarations so a rename cannot leave one store on the previous asset.
      - name: Check cross-platform release contracts
        run: npm run qa:platform-contracts

      - name: Check published layer-token allocations
        if: github.event_name == 'pull_request'
        run: npm run layer-token:check -- --base-ref origin/main

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  street-level-browser:
    # Hermetic: every Mapillary request is answered from fixtures, so the
    # dummy token below never leaves the page.
    name: Street Level browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
      # The browser is installed explicitly below. npm refuses dependency
      # install scripts, so Puppeteer's postinstall never fetches one.
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      # Same retry as the verify job: the ffmpeg-static post-install downloads
      # its binary from a GitHub release asset, which 504s in bursts.
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then
              exit 0
            fi
            rm -rf node_modules
            echo "npm ci failed on attempt $attempt"
            sleep 30
          done
          exit 1

      # npm 11 does not run dependency install scripts unless they are trusted,
      # so the Puppeteer postinstall above is skipped and the gate would fail
      # with "Browser was not found at the configured executablePath". Ask for
      # the browser at the version the lockfile pins.
      - name: Install the browser the gate drives
        run: npx puppeteer browsers install chrome

      - name: Report the installed browser
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          import puppeteer from 'puppeteer';
          const path = await puppeteer.executablePath();
          console.log(`Chrome executable: ${path}`);
          if (!existsSync(path)) throw new Error(`Chrome is not installed at ${path}`);
          const version = execFileSync(path, ['--version'], { encoding: 'utf8' });
          console.log(version.trim());
          EOF

      - name: Build production bundle with a dummy Mapillary token
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: npm run build

      - name: Start the preview server
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 2
          done
          cat preview.log
          exit 1

      - name: Street Level gate with Mapillary fixtures
        run: npm run qa:street-level:fixtures -- --strict --url http://localhost:4173

      - name: Preview server log
        if: failure()
        run: cat preview.log

      - name: Upload gate evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-gate-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  device-sweep-browser:
    # The gate that caught a CSP-blocked inline script and two regressions of
    # the sweep: it builds the real bundle, cuts the module graph on purpose and
    # drives the layer, the degraded console and both stalls in Chrome. The
    # Sentinel rotation gate reuses this same Chrome/fonts/build/preview setup.
    name: Device Sweep browser gate
    runs-on: ubuntu-latest
    # Two 12-minute gates, their 10-minute self-check, the 20-minute layer
    # activation matrix and its 10-minute self-check, plus browser, build and
    # preview setup: the job cap has to outlast them, so a slow gate times out
    # inside its own step and still uploads evidence instead of the job being
    # cancelled mid-step. Gates run after a previous gate's failure, so every
    # one of them can spend its full budget in the same run.
    timeout-minutes: 85
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
      # The browser is installed explicitly below. npm refuses dependency
      # install scripts, so Puppeteer's postinstall never fetches one.
      PUPPETEER_SKIP_DOWNLOAD: '1'
      PREVIEW_PORT: '4173'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      # Same retry as the other browser job: the ffmpeg-static post-install
      # downloads its binary from a GitHub release asset, which 504s in bursts.
      - name: Install locked dependencies and headless Chrome
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then
              exit 0
            fi
            rm -rf node_modules
            echo "npm ci failed on attempt $attempt"
            sleep 30
          done
          exit 1

      # npm 11 does not run dependency install scripts unless they are trusted,
      # so the Puppeteer postinstall above is skipped and the gate would fail
      # with "Could not find Chrome". Ask for the browser at the version the
      # lockfile pins; this is the same binary the postinstall would have left.
      - name: Install the browser the gate drives
        run: npx puppeteer browsers install chrome

      - name: Report the installed browser
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          import puppeteer from 'puppeteer';
          const path = await puppeteer.executablePath();
          console.log(`Chrome executable: ${path}`);
          if (!existsSync(path)) throw new Error(`Chrome is not installed at ${path}`);
          const version = execFileSync(path, ['--version'], { encoding: 'utf8' });
          console.log(version.trim());
          EOF

      # Text metrics decide where a click lands and how a chip wraps; a bare
      # runner has fewer fonts than a desktop and can measure differently.
      - name: Install fonts for deterministic text metrics
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation

      - name: Build production bundle
        run: npm run build

      - name: Start the preview server
        run: |
          npx vite preview --port "$PREVIEW_PORT" --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf "http://localhost:$PREVIEW_PORT/" > /dev/null && exit 0
            sleep 2
          done
          cat preview.log
          exit 1

      - name: Device Sweep gate
        id: device-sweep-gate
        timeout-minutes: 12
        run: node scripts/qa-device-sweep.mjs --url "http://localhost:$PREVIEW_PORT"

      # Reuse this job's Chrome, fonts, production build and preview server:
      # the Sentinel gate needs the same browser environment, not a second
      # installation of it. It also runs after a Device Sweep failure, so the
      # first gate's verdict cannot hide the Sentinel's own; a failure before
      # either gate (install, build, preview) still skips both, and a cancelled
      # run starts neither.
      - name: Sentinel rotation gate
        id: sentinel-rotation-gate
        if: ${{ !cancelled() && (success() || steps.device-sweep-gate.outcome == 'failure') }}
        timeout-minutes: 12
        run: npm run qa:sentinel-rotation -- --url "http://localhost:$PREVIEW_PORT"

      # The self-check proves the gate's assertions can still fail: it runs
      # three sabotaged boots and passes only when each one fires the assertion
      # it was built to trip. It reuses this job's Chrome, build and preview,
      # and it is keyed to the Sentinel step rather than to the Device Sweep, so
      # a Sentinel failure still gets its assertions checked — the one case
      # where knowing they bite matters most. Its budget is its own: the pair
      # boot stops after two scans, as soon as the repetition is caught. Three
      # boots measure about 3.5 minutes on a developer machine; a shared runner
      # can be twice as slow, and a 6-minute cap killed a run whose boots were
      # still working, so the cap leaves room for the work without hiding a
      # failed assertion.
      - name: Sentinel self-check
        id: sentinel-self-check
        if: ${{ !cancelled() && (success() || steps.sentinel-rotation-gate.outcome == 'failure') }}
        timeout-minutes: 10
        run: npm run qa:sentinel-rotation -- --self-check --url "http://localhost:$PREVIEW_PORT"

      # The activation matrix is deliberately a sibling of the two gates: it
      # reuses this job's Chrome, production build and preview server, and it
      # runs even when an earlier gate failed so one red gate cannot hide a
      # layer that fails to activate. Every /api request a layer needs is
      # answered by a fixture or an explicit passthrough; an unmatched route
      # is a 503 that fails that layer, never a quiet skip. Its own budget is
      # 20 minutes because it boots once and walks the runtime registry, not
      # one layer per browser launch.
      - name: Layer activation matrix
        id: layer-activation-matrix
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: npm run qa:layer-matrix -- --url "http://localhost:$PREVIEW_PORT" --strict

      # Sabotaged probes for the matrix's own assertions: an empty fixture must
      # fail the data check, a removed attribution must fail the credit check,
      # and a visible object left after disable must fail teardown. A green
      # matrix whose checks cannot fail is not evidence.
      - name: Layer activation matrix self-check
        id: layer-activation-self-check
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: npm run qa:layer-matrix -- --self-check --url "http://localhost:$PREVIEW_PORT" --strict

      # A green matrix still produces a useful baseline, and a red one needs
      # its failing layers visible without opening the artifact. Write both
      # outcomes to the job summary; the self-check is included when it ran.
      - name: Summarize layer activation matrix
        if: ${{ !cancelled() && steps.layer-activation-matrix.outcome != 'skipped' }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from 'node:fs';

          const reportPath = 'qa-artifacts/layer-activation/report.json';
          const selfCheckPath = 'qa-artifacts/layer-activation/self-check.json';
          const read = (path) => {
            try {
              return JSON.parse(readFileSync(path, 'utf8'));
            } catch {
              return null;
            }
          };
          const cell = (value) =>
            String(value ?? '')
              .replace(/\|/g, '\\|')
              .replace(/\r?\n/g, ' ')
              .slice(0, 500);
          const report = read(reportPath);
          const selfCheck = read(selfCheckPath);
          const lines = ['## Layer activation matrix', ''];

          if (!report) {
            lines.push('No matrix report was produced.');
            appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `${lines.join('\n')}\n`,
            );
            process.exit(0);
          }

          const summary = report.summary ?? {};
          const failedLayers = (report.layers ?? []).filter(
            (layer) => layer.status !== 'PASS',
          );
          lines.push(
            `Overall: **${report.ok ? 'PASS' : 'FAIL'}** · ${summary.passed ?? 0}/${summary.total ?? 0} layers passed`,
          );
          lines.push('');
          lines.push(
            `Fixture-backed ${summary.fixtureBacked ?? 0} · exceptions ${summary.exceptions ?? 0} · no-API ${summary.noApiActivations ?? 0} · unmocked API requests ${summary.unmockedApiRequests ?? 0}`,
          );

          if (failedLayers.length) {
            lines.push('', '### Failing layers', '', '| Layer | Reason |', '|---|---|');
            for (const layer of failedLayers) {
              const reasons = [];
              for (const [name, check] of [
                ['data', layer.data],
                ['credit', layer.credit],
                ['teardown', layer.teardown],
                ['network', layer.network],
              ]) {
                if (check && check.ok === false)
                  reasons.push(`${name}: ${check.reason ?? 'failed'}`);
              }
              if (!reasons.length && layer.error)
                reasons.push(String(layer.error));
              lines.push(
                `| \`${cell(layer.id)}\` | ${cell(reasons.join('; ') || 'failed')} |`,
              );
            }
          } else {
            lines.push('', 'No layer failed.');
          }

          if (summary.unmockedUrls?.length) {
            lines.push('', '### Unmocked API requests', '');
            for (const url of summary.unmockedUrls)
              lines.push(`- \`${cell(url)}\``);
          }
          if (report.pageErrors?.length) {
            lines.push('', '### Page errors', '');
            for (const error of report.pageErrors.slice(0, 10))
              lines.push(`- ${cell(`${error.type}: ${error.text}`)}`);
          }

          if (selfCheck) {
            const failedChecks = (selfCheck.checks ?? []).filter(
              (check) => !check.ok,
            );
            lines.push(
              '',
              `### Matrix self-check: **${selfCheck.ok ? 'PASS' : 'FAIL'}**`,
            );
            if (failedChecks.length) {
              lines.push('', '| Check | Reason |', '|---|---|');
              for (const check of failedChecks)
                lines.push(
                  `| ${cell(check.name)} | ${cell(check.detail || 'failed')} |`,
                );
            }
          }

          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `${lines.join('\n')}\n`,
          );
          EOF

      - name: Preview server log
        if: failure()
        run: cat preview.log

      # Each artifact carries only the gate it belongs to: the two gates write
      # different subtrees of qa-artifacts/, and a shared path would put the
      # other gate's pages in this archive whenever both failed.
      - name: Upload Device Sweep gate evidence
        if: failure() && steps.device-sweep-gate.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-sweep-gate-evidence
          path: qa-artifacts/qa-device-sweep/
          retention-days: 14

      # Uploaded when either Sentinel step fails. A red gate is the obvious
      # case; a red self-check is the other one, and the one where evidence
      # matters most — the assertions stopped biting, and the pages show why.
      # Keyed to the Sentinel steps alone: a Device Sweep failure must not
      # upload this archive, and a green Sentinel uploads nothing even though
      # the job stays failed.
      - name: Upload Sentinel rotation gate evidence
        if: ${{ !cancelled() && (steps.sentinel-rotation-gate.outcome == 'failure' || steps.sentinel-self-check.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-rotation-gate-evidence
          path: qa-artifacts/sentinel-rotation/
          retention-days: 14

      # Matrix and self-check deliberately write separate files. Upload both
      # whenever the matrix ran, including a green run: report.json is the
      # baseline, and self-check.json proves the probes still bite. Keeping the
      # report on success makes a later regression comparable with a good run.
      - name: Upload layer activation evidence
        if: ${{ !cancelled() && steps.layer-activation-matrix.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layer-activation-matrix-evidence
          path: qa-artifacts/layer-activation/
          retention-days: 14

  windows-onboarding:
    name: Windows onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      # This path runs `npm ci` itself, so it needs the same retry as the
      # Ubuntu jobs: the install fails only while ffmpeg-static's download is
      # being 504'd, and a fresh `node_modules` is enough to try again.
      - name: Run the Pinokio install path
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node scripts/pinokio-install.mjs; then
              exit 0
            fi
            rm -rf node_modules
            echo "Pinokio install failed on attempt $attempt"
            sleep 30
          done
          exit 1

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Run focused onboarding tests
        run: node --test src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/keySetupHardening.test.mjs src/mapStartup.test.mjs src/hudSummaryResponse.test.mjs src/codexOauthRealtime.test.mjs

      - name: Build production bundle
        run: npm run build

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The ffmpeg-static post-install fetches its binary from a GitHub release
      # page, and the unauthenticated `/releases/download/` path has been
      # returning 504s in bursts since Nov 8 (community #212407). The failure is
      # intermittent, so the locked install retries over fresh `node_modules`
      # with a pause before the job is given up on.
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then
              exit 0
            fi
            rm -rf node_modules
            echo "npm ci failed on attempt $attempt"
            sleep 30
          done
          exit 1

      - name: Run setup policy checks
        run: npm run doctor -- --json

      - name: Check adopted formatting
        run: npm run format:check

      # The code is the source of every message key, so a string added without
      # its five translations only fails here: a review that never opens a
      # locale file would otherwise merge an English-only screen.
      - name: Check translation catalogs
        run: npm run i18n

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Check published layer-token allocations
        if: github.event_name == 'pull_request'
        run: npm run layer-token:check -- --base-ref origin/main

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  street-level-browser:
    # Hermetic: every Mapillary request is answered from fixtures, so the
    # dummy token below never leaves the page.
    name: Street Level browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
      # The browser is installed explicitly below. npm refuses dependency
      # install scripts, so Puppeteer's postinstall never fetches one.
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      # Same retry as the verify job: the ffmpeg-static post-install downloads
      # its binary from a GitHub release asset, which 504s in bursts.
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then
              exit 0
            fi
            rm -rf node_modules
            echo "npm ci failed on attempt $attempt"
            sleep 30
          done
          exit 1

      # npm 11 does not run dependency install scripts unless they are trusted,
      # so the Puppeteer postinstall above is skipped and the gate would fail
      # with "Browser was not found at the configured executablePath". Ask for
      # the browser at the version the lockfile pins.
      - name: Install the browser the gate drives
        run: npx puppeteer browsers install chrome

      - name: Report the installed browser
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          import puppeteer from 'puppeteer';
          const path = await puppeteer.executablePath();
          console.log(`Chrome executable: ${path}`);
          if (!existsSync(path)) throw new Error(`Chrome is not installed at ${path}`);
          const version = execFileSync(path, ['--version'], { encoding: 'utf8' });
          console.log(version.trim());
          EOF

      - name: Build production bundle with a dummy Mapillary token
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: npm run build

      - name: Start the preview server
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 2
          done
          cat preview.log
          exit 1

      - name: Street Level gate with Mapillary fixtures
        run: npm run qa:street-level:fixtures -- --strict --url http://localhost:4173

      - name: Preview server log
        if: failure()
        run: cat preview.log

      - name: Upload gate evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-gate-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  device-sweep-browser:
    # The gate that caught a CSP-blocked inline script and two regressions of
    # the sweep: it builds the real bundle, cuts the module graph on purpose and
    # drives the layer, the degraded console and both stalls in Chrome. The
    # Sentinel rotation gate reuses this same Chrome/fonts/build/preview setup.
    name: Device Sweep browser gate
    runs-on: ubuntu-latest
    # Two 12-minute gates plus the browser, build and preview setup: the job
    # cap has to outlast them, so a slow gate times out inside its own step
    # and still uploads evidence instead of the job being cancelled mid-step.
    # The Sentinel gate now also runs after a Device Sweep failure, so both
    # gates can spend their full budget in one run.
    timeout-minutes: 36
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
      # The browser is installed explicitly below. npm refuses dependency
      # install scripts, so Puppeteer's postinstall never fetches one.
      PUPPETEER_SKIP_DOWNLOAD: '1'
      PREVIEW_PORT: '4173'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      # Same retry as the other browser job: the ffmpeg-static post-install
      # downloads its binary from a GitHub release asset, which 504s in bursts.
      - name: Install locked dependencies and headless Chrome
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then
              exit 0
            fi
            rm -rf node_modules
            echo "npm ci failed on attempt $attempt"
            sleep 30
          done
          exit 1

      # npm 11 does not run dependency install scripts unless they are trusted,
      # so the Puppeteer postinstall above is skipped and the gate would fail
      # with "Could not find Chrome". Ask for the browser at the version the
      # lockfile pins; this is the same binary the postinstall would have left.
      - name: Install the browser the gate drives
        run: npx puppeteer browsers install chrome

      - name: Report the installed browser
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          import puppeteer from 'puppeteer';
          const path = await puppeteer.executablePath();
          console.log(`Chrome executable: ${path}`);
          if (!existsSync(path)) throw new Error(`Chrome is not installed at ${path}`);
          const version = execFileSync(path, ['--version'], { encoding: 'utf8' });
          console.log(version.trim());
          EOF

      # Text metrics decide where a click lands and how a chip wraps; a bare
      # runner has fewer fonts than a desktop and can measure differently.
      - name: Install fonts for deterministic text metrics
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation

      - name: Build production bundle
        run: npm run build

      - name: Start the preview server
        run: |
          npx vite preview --port "$PREVIEW_PORT" --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf "http://localhost:$PREVIEW_PORT/" > /dev/null && exit 0
            sleep 2
          done
          cat preview.log
          exit 1

      - name: Device Sweep gate
        id: device-sweep-gate
        timeout-minutes: 12
        run: node scripts/qa-device-sweep.mjs --url "http://localhost:$PREVIEW_PORT"

      # Reuse this job's Chrome, fonts, production build and preview server:
      # the Sentinel gate needs the same browser environment, not a second
      # installation of it. It also runs after a Device Sweep failure, so the
      # first gate's verdict cannot hide the Sentinel's own; a failure before
      # either gate (install, build, preview) still skips both, and a cancelled
      # run starts neither.
      - name: Sentinel rotation gate
        id: sentinel-rotation-gate
        if: ${{ !cancelled() && (success() || steps.device-sweep-gate.outcome == 'failure') }}
        timeout-minutes: 12
        run: npm run qa:sentinel-rotation -- --url "http://localhost:$PREVIEW_PORT"

      - name: Preview server log
        if: failure()
        run: cat preview.log

      - name: Upload Device Sweep gate evidence
        if: failure() && steps.device-sweep-gate.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-sweep-gate-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      # Keyed to the Sentinel step alone: a Device Sweep failure must not upload
      # this archive, and a Sentinel success uploads nothing even though the
      # job stays failed.
      - name: Upload Sentinel rotation gate evidence
        if: steps.sentinel-rotation-gate.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-rotation-gate-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  windows-onboarding:
    name: Windows onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      # This path runs `npm ci` itself, so it needs the same retry as the
      # Ubuntu jobs: the install fails only while ffmpeg-static's download is
      # being 504'd, and a fresh `node_modules` is enough to try again.
      - name: Run the Pinokio install path
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node scripts/pinokio-install.mjs; then
              exit 0
            fi
            rm -rf node_modules
            echo "Pinokio install failed on attempt $attempt"
            sleep 30
          done
          exit 1

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Run focused onboarding tests
        run: node --test src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/keySetupHardening.test.mjs src/mapStartup.test.mjs src/hudSummaryResponse.test.mjs src/codexOauthRealtime.test.mjs

      - name: Build production bundle
        run: npm run build

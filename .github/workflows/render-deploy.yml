name: Deploy to Render

# The Render service was created from a public Git URL, so Render has no
# webhook on this repository and its `autoDeploy` never fires by itself. This
# workflow is the bridge: a push to the branch the service builds from asks
# Render for a deploy through its API, which is the same call the dashboard's
# "Manual Deploy" makes.
#
# It also stays until the deploy is live and then asks the public origin the
# same questions a browser does, so a broken build shows up as a red run
# instead of a service that quietly serves the previous release.
#
# Needs a repository secret RENDER_API_KEY (Render -> Account Settings -> API
# Keys). Deploys are serialised, not cancelled: a push that arrives mid-build
# queues the next one instead of leaving the service on an older commit.
on:
  push:
    branches: [android-shell]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

env:
  RENDER_SERVICE_ID: srv-dbe6r4rncjis73d78o90
  BASE_URL: https://gev-data.onrender.com

jobs:
  deploy:
    name: Ask Render for a deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Server-only provider keys live in the Render service's Environment tab,
      # not in this repository or in the browser. Each one is kept in sync from
      # a repository secret of the same name: the proxies add them upstream, so
      # an unset value silently empties a layer rather than failing loudly.
      # Setting them here (idempotently, only when the value differs) means a
      # fresh service or a rotated key needs no dashboard trip, and the deploy
      # that follows already has them.
      - name: Sync server-only keys onto the service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          N2YO_API_KEY: ${{ secrets.N2YO_API_KEY }}
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: |
          set -euo pipefail
          base="https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars"

          sync_key() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::warning::$name is not a repository secret; its route will answer no_key."
              return 0
            fi
            current=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "$base/$name" | jq -r '.value // ""')
            if [ "$current" = "$value" ]; then
              echo "$name already up to date"
              return 0
            fi
            code=$(curl -sS -o "$RUNNER_TEMP/env-var.json" -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -cn --arg v "$value" '{value: $v}')" \
              "$base/$name")
            echo "PUT $name -> $code"
            case "$code" in
              200|201) ;;
              *)
                cat "$RUNNER_TEMP/env-var.json" || true
                echo "::error::Render answered $code while setting $name"
                exit 1
                ;;
            esac
          }

          sync_key N2YO_API_KEY "${N2YO_API_KEY:-}"
          sync_key SPACETRACK_USER "${SPACETRACK_USER:-}"
          sync_key SPACETRACK_PASSWORD "${SPACETRACK_PASSWORD:-}"

      - name: Trigger the deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY is not set; add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          body=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")
          printf '%s\n' "$body"
          deploy_id=$(printf '%s' "$body" | jq -r '.id // ""')
          case "$deploy_id" in
            dep-*) ;;
            *) echo "::error::Render did not accept the deploy"; exit 1 ;;
          esac
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "queued $deploy_id for ${GITHUB_SHA}"

      - name: Wait until it is live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          while :; do
            status=$(curl -sS --fail-with-body \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" | jq -r '.status')
            echo "status: $status"
            case "$status" in
              live) exit 0 ;;
              *_failed|canceled|deactivated)
                echo "::error::Render reported $status for $DEPLOY_ID"
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$DEPLOY_ID was still $status after ${deadline}s"
              exit 1
            fi
            sleep 10
          done

      - name: Check the origin answers
        run: |
          set -euo pipefail
          # A free instance sleeps when idle, so the first request can pay a
          # cold start of up to a minute; retry rather than fail on that.
          code=000
          for attempt in $(seq 1 8); do
            code=$(curl -sS -o "$RUNNER_TEMP/home.html" -w '%{http_code}' \
              --max-time 120 "$BASE_URL/" || echo 000)
            echo "GET / -> $code (attempt $attempt)"
            [ "$code" = "200" ] && break
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "::error::$BASE_URL/ answered $code"
            exit 1
          fi
          grep -q "<title>God's Eye View</title>" "$RUNNER_TEMP/home.html" \
            || { echo "::error::the served document is not the app"; exit 1; }

          curl -sS --fail-with-body --max-time 120 \
            "$BASE_URL/api/terrain/heights?points=2.3522,48.8566" -o "$RUNNER_TEMP/heights.json"
          cat "$RUNNER_TEMP/heights.json"
          python3 - "$RUNNER_TEMP/heights.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          results = data.get("results") or []
          if len(results) != 1:
              raise SystemExit("expected one height, got %d" % len(results))
          elevation = results[0].get("elevation")
          # Paris sits around 30-40 m: a plausible number proves the route ran
          # for real instead of answering with a placeholder.
          if not isinstance(elevation, (int, float)) or not 20 <= elevation <= 60:
              raise SystemExit("implausible elevation for Paris: %r" % (elevation,))
          print("elevation ok: %.2f m" % elevation)
          PY

      # One call per deploy keeps well inside N2YO's hourly quota. A refusal is
      # reported, not fatal: the app still works without this source, and the
      # failure a red run would signal here is a key problem, not a bad build.
      - name: Check the N2YO route has its key
        run: |
          set -euo pipefail
          body=$(curl -sS --max-time 120 -w '\n%{http_code}' \
            "$BASE_URL/api/n2yo/above?lat=32&lon=35&radius=20")
          code=$(printf '%s' "$body" | tail -n1)
          payload=$(printf '%s' "$body" | sed '$d')
          echo "GET /api/n2yo/above -> $code"
          echo "$payload" | head -c 400
          echo
          if [ "$code" = "200" ]; then exit 0; fi
          if [ "$code" = "503" ]; then
            echo "::warning::N2YO_API_KEY is missing on the service; the satellites-overhead source stays empty."
            exit 0
          fi
          echo "::error::/api/n2yo/above answered $code"
          exit 1

      # Space-Track allows one GP read an hour for the whole account, so this is
      # the only call the deploy makes: it both proves the account is live and
      # leaves the route's hour-long cache warm for the layer. The CDM feed is
      # deliberately not touched — three downloads a day is scarce. As above, a
      # missing account is a warning, not a failed build.
      - name: Check the Space-Track route has its account
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 180 -D "$RUNNER_TEMP/st-headers.txt" \
            -o "$RUNNER_TEMP/gp.json" -w '%{http_code}' \
            "$BASE_URL/api/spacetrack/gp" || echo 000)
          echo "GET /api/spacetrack/gp -> $code"
          grep -i '^x-spacetrack-cache' "$RUNNER_TEMP/st-headers.txt" || true
          if [ "$code" = "200" ]; then
            python3 - "$RUNNER_TEMP/gp.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          entries = payload.get("entries") or []
          if not entries:
              raise SystemExit("GP answered 200 with no element sets")
          first = entries[0]
          line1, line2 = str(first.get("line1", "")), str(first.get("line2", ""))
          if not (line1.startswith("1 ") and line2.startswith("2 ")):
              raise SystemExit("GP entry is not a two-line element set: %r" % (first,))
          print("GP ok: %d element sets, e.g. %s" % (len(entries), first.get("norad")))
          PY
            exit 0
          fi
          if [ "$code" = "503" ]; then
            echo "::warning::SPACETRACK_USER/PASSWORD are missing on the service; element sets and conjunctions stay empty."
            exit 0
          fi
          echo "::error::/api/spacetrack/gp answered $code"
          exit 1

# Standalone Windows app for the iOS studio panel: the page `npm run ios:studio`
# serves, in its own window, with its own icon and a real installer.
#
# What this packages is the window and the panel server, not the project. The
# buttons run `npm run ...` and `xtool` against a checkout, so the installer
# stays a few tens of megabytes and the checkout stays the source of truth: the
# app remembers which folder by path, and `GEV_PROJECT_ROOT` is what tells the
# bundled server where that is.
#
# Windows only, for the same reason the app's own shell is: the panel drives
# xtool through WSL, which is the path this repository can test.

appId: com.godseyeview.iosstudio
productName: iOS studio
copyright: God's Eye View — MIT

directories:
  output: release
  buildResources: assets

# The window, the icon, and — when `build-installer.mjs` wrote one — the folder
# this app was built from, so a fresh install opens on the right project.
files:
  - main.mjs
  - package.json
  - assets/**
  - project-root.json

# The panel is copied from the repository verbatim rather than reimplemented, so
# the window and the terminal path cannot drift into two behaviours.
extraResources:
  - from: ../../scripts/ios-studio.mjs
    to: server/ios-studio.mjs
  - from: ../../scripts/ios-studio.html
    to: server/ios-studio.html
  - from: ../../scripts/build-ios-ipa.mjs
    to: server/build-ios-ipa.mjs
  - from: ../../scripts/compare-ios-plists.mjs
    to: server/compare-ios-plists.mjs

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName} Setup ${version}.exe

nsis:
  # Assisted, not silent: the user sees where it lands and can change it.
  # Per-user by default, so it needs no administrator prompt.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: iOS studio
  # The remembered project folder and the log survive an uninstall; the
  # installed app itself does not.
  deleteAppDataOnUninstall: false

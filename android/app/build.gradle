plugins {
  id 'com.android.application'
}

// Android only installs an update signed by the same key as the copy already on
// the device, and a CI runner's default debug keystore is regenerated per job.
// CI therefore supplies its own key through the environment; a local build with
// no such variables falls back to the ordinary debug key.
def ciKeystore = System.getenv('GEV_KEYSTORE_PATH')
def ciKeyAlias = System.getenv('GEV_KEY_ALIAS') ?: 'godseyeview'
def ciStorePassword = System.getenv('GEV_KEYSTORE_PASSWORD')
def ciKeyPassword = System.getenv('GEV_KEY_PASSWORD') ?: ciStorePassword
// A per-build version code keeps the phone's installer on the "update" path
// instead of treating a new download as the same version.
def buildVersionCode = (System.getenv('GEV_VERSION_CODE') ?: '1').toInteger()
def buildVersionName = (System.getenv('GEV_VERSION_NAME') ?: '1.0')
// Origin of a running copy of this project's server. The live layers ask their
// own origin for /api/*; the shell replays those calls here. Empty keeps the
// app self-contained, with the server-backed layers reporting unavailable.
def dataServer = (System.getenv('GEV_API_BASE') ?: '').trim()

android {
  namespace 'com.godseye.view'
  compileSdk 36

  defaultConfig {
    applicationId 'com.godseye.view'
    minSdk 24
    targetSdk 36
    versionCode buildVersionCode
    versionName buildVersionName
    buildConfigField 'String', 'API_BASE', "\"${dataServer}\""
  }

  buildFeatures {
    buildConfig true
  }

  signingConfigs {
    ci {
      if (ciKeystore) {
        storeFile file(ciKeystore)
        storePassword ciStorePassword
        keyAlias ciKeyAlias
        keyPassword ciKeyPassword
      }
    }
  }

  // The whole Vite build (Cesium, models, icons) rides along as assets.
  sourceSets {
    main {
      assets.srcDirs += ['src/main/assets']
    }
  }

  buildTypes {
    debug {
      minifyEnabled false
    }
    release {
      minifyEnabled false
      // Signed with the CI key when the workflow provides one, otherwise with
      // the debug key so a local build installs without a keystore.
      signingConfig ciKeystore ? signingConfigs.ci : signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // Cesium streams .wasm and model binaries; letting aapt store them verbatim
  // avoids a decompress pass on every request.
  androidResources {
    noCompress 'wasm', 'glb', 'gltf', 'bin', 'gz'
  }
}
